<!doctype html>
<html lang="ko">
<head>{% include head.html %}</head>
<body>
<header class="top">
  <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="on"{% endif %}>글</a>
    <a href="{{ '/series/' | relative_url }}"{% if page.url contains '/series/' %} class="on"{% endif %}>시리즈</a>
    <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags/' %} class="on"{% endif %}>태그</a>
    {% if site.categories.size > 0 %}<a href="{{ '/categories/' | relative_url }}"{% if page.url contains '/categories/' %} class="on"{% endif %}>카테고리</a>{% endif %}
    <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} class="on"{% endif %}>소개</a>
    <a href="https://github.com/{{ site.author.github }}" rel="me">GitHub</a>
  </nav>
</header>
<main class="main">{{ content }}</main>
<footer class="foot"><span>© {{ site.time | date: '%Y' }} {{ site.author.name }}</span><a href="{{ '/feed.xml' | relative_url }}">RSS</a></footer>
</body>
</html>
